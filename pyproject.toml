[project]
name = "traluat"
version = "0.0.1"
description = "TraLuat — Vietnam legal-AI engine (W2 bitemporal core first)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "fastapi>=0.162.2",
    "pyjwt>=2.8",
    "pgvector>=0.3",
    "celery>=5.3",
    "cryptography>=42",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
models = [
    "pillow>=13.0.0",
    "protobuf>=7.36.2",
    "sentence-transformers>=6.2.0",
    "sentencepiece>=0.2.3",
    "setuptools<81",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.22.2",
    "vietocr>=0.3.12",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
