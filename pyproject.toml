[project]
name = "traluat"
version = "0.0.1"
description = "TraLuat — Vietnam legal-AI engine (W2 bitemporal core first)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]
