# TraLuat — Postgres (SoR + L4 index) cho dev. Residency thật = đặt tại VN khi deploy.
# pgvector/pgvector:pg16 = postgres:16 + extension `vector` (HNSW) cho L4 embedding.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: traluat-pg
    environment:
      POSTGRES_USER: traluat
      POSTGRES_PASSWORD: traluat
      POSTGRES_DB: traluat
    ports:
      - "5433:5432"   # 5433 host để tránh đụng pg local
    volumes:
      - traluat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traluat -d traluat"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Async task layer (W5 §1) — broker + result backend. Dev; test dùng InMemoryTaskQueue.
  rabbitmq:
    image: rabbitmq:3-management
    container_name: traluat-rmq
    ports: ["5672:5672", "15672:15672"]
    profiles: ["async"]      # `docker compose --profile async up` mới bật
  redis:
    image: redis:7
    container_name: traluat-redis
    ports: ["6379:6379"]
    profiles: ["async"]
  worker:
    image: python:3.12-slim
    container_name: traluat-worker
    profiles: ["async"]
    depends_on: [postgres, rabbitmq, redis]
    working_dir: /app
    volumes: ["./:/app"]
    environment:
      DATABASE_URL: postgresql+psycopg://traluat:traluat@postgres:5432/traluat
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: >-
      sh -c "pip install -e . && celery -A traluat.w5.celery_app.celery_app worker -l info"

  # API + observability (profile 'obs'): `docker compose --profile obs up`
  api:
    image: python:3.12-slim
    container_name: traluat-api
    profiles: ["obs"]
    depends_on: [postgres]
    working_dir: /app
    volumes: ["./:/app"]
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://traluat:traluat@postgres:5432/traluat
    command: >-
      sh -c "pip install -e . && uvicorn traluat.w5.asgi:app --host 0.0.0.0 --port 8000"
  prometheus:
    image: prom/prometheus
    container_name: traluat-prom
    profiles: ["obs"]
    ports: ["9090:9090"]
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml"]
  grafana:
    image: grafana/grafana
    container_name: traluat-grafana
    profiles: ["obs"]
    ports: ["3000:3000"]
  # Neo4j projection (ADR-0001 option c) — đồ thị phái sinh từ norm_relation.
  neo4j:
    image: neo4j:5
    container_name: traluat-neo4j
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/traluat-neo4j-pw
    ports: ["7474:7474", "7687:7687"]

volumes:
  traluat_pgdata:
